[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxml-rag"
version = "0.1.0"
description = "RAG + GraphRAG system over AUTOSAR Classic ARXML files"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Pydantic
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Agents
    "pydantic-ai>=0.0.13",
    # LLM SDKs
    "anthropic>=0.28",
    "openai>=1.30",
    # Vector store
    "qdrant-client>=1.9",
    # Graph store
    "neo4j>=5.20",
    # Exact search
    "duckdb>=0.10",
    # Embeddings + reranker
    "sentence-transformers>=3.0",
    # Observability
    "langfuse>=2.30",
    # Task queue
    "arq>=0.26",
    "redis>=5.0",
    # Supabase
    "supabase>=2.4",
    # Evaluation
    "ragas>=0.1",
    "deepeval>=0.21",
    # Utilities
    "httpx>=0.27",
    "lxml>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-lxml>=2024.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arxml_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
